CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- NFC ---
CONFIG_NFC_T4T_NRFXLIB=y

# Tag advertises this as its writable NDEF capacity. 8 KiB fits the ~3.9 KiB
# binary XEPR MIME record, the ~7.9 KiB BW hex-text encoding and each of the
# two ~8.0 KiB halves of the split 4C text encoding (XEPR2A/XEPR2B).
CONFIG_NDEF_FILE_SIZE=8192

CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_REC=y
CONFIG_NFC_NDEF_URI_MSG=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- Logging / console ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y

# --- ePaper display (SSD1680 / JD79661 via MIPI DBI SPI) ---
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_DISPLAY=y

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_COLOR_DEPTH_1=y
# The GDEY0213B74/SSD1680 RAM uses 1 = white, 0 = black, but the ssd16xx
# driver advertises MONO10 (1 = black). Invert the LVGL mono output so
# white pixels end up as 1 in the panel RAM.
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
CONFIG_LV_USE_DRAW_VG_LITE=n
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_USE_CLIB_MALLOC=y
CONFIG_LV_USE_CLIB_STRING=y
CONFIG_LV_USE_CLIB_SPRINTF=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# --- Memory ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- NFC callback stacks (fix: stack overflow when writing an image) ---
# With only NFC_THREAD_CALLBACK the t4t event callbacks run on the system
# workqueue, whose default stack is 1024 B. Writing a ~4 KiB XEPR NDEF
# overflows it. Run the callbacks on a dedicated NFC thread instead, and
# enlarge the shared stacks (ISO-DEP frame handling runs in IRQ context).
CONFIG_NFC_OWN_THREAD=y
CONFIG_NFC_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
